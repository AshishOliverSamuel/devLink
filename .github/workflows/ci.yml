name: DevLink CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache-dependency-path: backend/devLink-server/go.sum

    - name: Install dependencies
      working-directory: backend/devLink-server
      run: go mod tidy

    - name: Build project
      working-directory: backend/devLink-server
      run: go build ./...
